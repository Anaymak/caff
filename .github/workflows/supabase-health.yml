# Daily CAFF health check (prepared 22 Oct 2026; active only once pushed to GitHub).
# Supabase Free projects pause after ~7 days without database activity; Supabase's docs state that a few
# requests per day keep a project active. This makes one read-only, RLS-protected request with the PUBLIC anon
# key (the same key shipped to every browser) and fails loudly if the site or database is down.
name: CAFF health check
on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Website responds
        run: test "$(curl -s -o /dev/null -w '%{http_code}' https://caff.anaysprojects.com/auth/)" = "200"
      - name: Supabase auth and database respond
        env:
          SUPABASE_URL: https://vkdsdgiecuvviaukrafa.supabase.co
          ANON_KEY: ${{ secrets.CAFF_SUPABASE_ANON_KEY }}
        run: |
          test -n "$ANON_KEY" || { echo "Set repository secret CAFF_SUPABASE_ANON_KEY (public anon key)"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $ANON_KEY" "$SUPABASE_URL/auth/v1/health")" = "200"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" "$SUPABASE_URL/rest/v1/venues?select=id&limit=1")
          test "$code" = "200" || { echo "Database request returned $code"; exit 1; }
