AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CAFF static web app on private S3 + CloudFront (pay-as-you-go, no WAF, no flat-rate
  subscription). Auth, database and file storage stay on Supabase. Deploy in us-east-1
  (required for the optional ACM certificate). Prepared 21 Oct 2026; NOT yet deployed.

Parameters:
  SiteBucketName:
    Type: String
    Description: Globally unique private bucket name, e.g. caff-site-971422695222.
    AllowedPattern: '^caff-[a-z0-9-]{3,58}$'
  DomainName:
    Type: String
    Default: ''
    Description: >-
      Optional custom hostname in an EXISTING Route 53 zone (e.g. caff.anaysprojects.com).
      Leave empty to use the free *.cloudfront.net hostname.
  HostedZoneId:
    Type: String
    Default: ''
    Description: Route 53 hosted zone ID for DomainName (only when DomainName is set).

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, '']]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref SiteBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-site-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 14 }

  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: caff-private-s3
        Description: Private CAFF static origin
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # Source of truth for this code: kept identical to infra/viewer-request.js (tests compare them).
  UrlFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: caff-static-routes
      AutoPublish: true
      FunctionConfig:
        Comment: Serve dynamic [id] routes from the prerendered "_" page; map directories to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        var DYNAMIC = /^\/dashboard\/(admin\/matches|matches|player)\/([^\/.]+)(\/.*)?$/;

        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var m = uri.match(DYNAMIC);
          if (m && m[2] !== '_' && m[3]) {
            uri = '/dashboard/' + m[1] + '/_' + m[3];
          }
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
            return request;
          }
          var last = uri.substring(uri.lastIndexOf('/') + 1);
          if (last.indexOf('.') === -1) {
            var qs = request.querystring && Object.keys(request.querystring).length
              ? '?' + Object.keys(request.querystring).map(function (k) {
                  var v = request.querystring[k];
                  return encodeURIComponent(k) + (v && v.value !== undefined && v.value !== '' ? '=' + encodeURIComponent(v.value) : '');
                }).join('&')
              : '';
            return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: request.uri + '/' + qs } } };
          }
          request.uri = uri;
          return request;
        }

  HeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: caff-security-headers
        SecurityHeadersConfig:
          StrictTransportSecurity: { AccessControlMaxAgeSec: 31536000, IncludeSubdomains: false, Preload: false, Override: true }
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';
              img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data:;
              connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none';
              base-uri 'self'; form-action 'self'; object-src 'none'

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: CAFF static app (Supabase backend)
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasDomain
          - { AcmCertificateArn: !Ref Certificate, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          - { CloudFrontDefaultCertificate: true }
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccess.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref HeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlFunction.FunctionMetadata.FunctionARN

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  AliasRecord:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

Outputs:
  BucketName: { Value: !Ref SiteBucket }
  DistributionId: { Value: !Ref Distribution }
  SiteUrl: { Value: !If [HasDomain, !Sub 'https://${DomainName}', !Sub 'https://${Distribution.DomainName}'] }
